<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tennis Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --text: #1d2a22; --muted: #637067; --line: #e2e6e1;
    --brand: #386b4f; --ok: #2e8b4e; --ok-bg: #e5f4ea; --bad: #c0392b; --bad-bg: #fbe9e7;
    --dry: #6b5bb5; --dry-bg: #eeebfa; --wait: #9a6b00; --wait-bg: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111613; --card: #1a211c; --text: #e6ece7; --muted: #95a39a; --line: #2b352e;
      --brand: #7fc79c; --ok: #6fd08f; --ok-bg: #173523; --bad: #ff8a7a; --bad-bg: #3a1d19;
      --dry: #b3a6ff; --dry-bg: #262143; --wait: #f2c55c; --wait-bg: #3a2f12;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111613; --card: #1a211c; --text: #e6ece7; --muted: #95a39a; --line: #2b352e;
    --brand: #7fc79c; --ok: #6fd08f; --ok-bg: #173523; --bad: #ff8a7a; --bad-bg: #3a1d19;
    --dry: #b3a6ff; --dry-bg: #262143; --wait: #f2c55c; --wait-bg: #3a2f12;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 22px; margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px; }
  .status { display: flex; gap: 14px; align-items: center; }
  .badge { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .ok { color: var(--ok); background: var(--ok-bg); }
  .bad { color: var(--bad); background: var(--bad-bg); }
  .dry { color: var(--dry); background: var(--dry-bg); }
  .wait { color: var(--wait); background: var(--wait-bg); }
  .big { font-size: 20px; font-weight: 650; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
  .grid dt { color: var(--muted); }
  .grid dd { margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  ul.runs { list-style: none; margin: 0; padding: 0; }
  ul.runs li { padding: 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  ul.runs li:first-child { border-top: 0; padding-top: 0; }
  .msg { grid-column: 1 / -1; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  [dir=auto] { unicode-bidi: plaintext; }
  #err { color: var(--bad); }
  #lock { max-width: 360px; margin: 18vh auto 0; text-align: center; }
  #lock form { display: flex; gap: 8px; margin-top: 16px; }
  #lock input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px;
                border: 1px solid var(--line); background: var(--card); color: var(--text); }
  #lock button, .link { font: inherit; padding: 10px 16px; border-radius: 10px; border: 0;
                background: var(--brand); color: var(--bg); font-weight: 600; cursor: pointer; }
  .link { background: none; color: var(--muted); padding: 0; font-weight: 400; font-size: 14px; text-decoration: underline; }
  #lockerr { color: var(--bad); min-height: 1.5em; margin-top: 10px; font-size: 14px; }
  [hidden] { display: none !important; }
  .shot { margin-top: 14px; text-align: center; }
  .shot img { max-width: 100%; max-height: 70vh; border-radius: 12px; border: 1px solid var(--line); display: inline-block; }
  .more { grid-column: 1 / -1; margin-top: 8px; padding: 12px; border-radius: 10px; background: var(--bg); }
  .more .grid { font-size: 14px; }
</style>
</head>
<body>
<section class="card" id="lock" hidden>
  <h1>🎾 Tennis Bot</h1>
  <p class="muted">Enter the password to view the status.</p>
  <form id="lockform">
    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Password" autofocus>
    <button type="submit">Open</button>
  </form>
  <div id="lockerr"></div>
</section>
<main id="app" hidden>
  <header>
    <h1>🎾 Tennis Bot</h1>
    <span class="muted"><span id="updated"></span> · <button class="link" id="logout">Lock</button></span>
  </header>

  <section class="card" id="latest"><span class="muted">Loading…</span></section>

  <section class="card">
    <h2>Schedule</h2>
    <dl class="grid" id="schedule"></dl>
  </section>

  <section class="card">
    <h2>Recent runs</h2>
    <ul class="runs" id="runs"></ul>
  </section>
  <p class="muted" id="err"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = iso => iso ? new Date(iso).toLocaleString("en-GB", { weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Jerusalem" }) : "—";
function kind(r) {
  if (!r.ok) return ["bad", "Failed"];
  return r.dry_run ? ["dry", "Dry run OK"] : ["ok", "Booked"];
}
// ---- password + decryption (AES-256-GCM, PBKDF2-SHA256; matches register.py encrypt_json) ----
const KEY = "tennis-bot-pw";
const store = { get() { try { return localStorage.getItem(KEY); } catch { return null; } },
                set(v) { try { localStorage.setItem(KEY, v); } catch {} },
                del() { try { localStorage.removeItem(KEY); } catch {} } };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function fetchEnc() {
  const res = await fetch("status.enc.json?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
async function decrypt(env, pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(env.salt), iterations: env.iter },
                                            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
let password = null;
function showLock(msg) {
  $("app").hidden = true; $("lock").hidden = false; $("lockerr").textContent = msg || ""; $("pw").focus();
}
$("lockform").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("pw").value;
  $("lockerr").textContent = "Checking…";
  try {
    const s = await decrypt(await fetchEnc(), pw);
    password = pw; store.set(pw); $("pw").value = "";
    $("lock").hidden = true; $("app").hidden = false;
    render(s);
  } catch (err) {
    $("lockerr").textContent = err.name === "OperationError" ? "Wrong password" : "Could not load: " + err.message;
  }
});
$("logout").addEventListener("click", () => { password = null; store.del(); showLock(); });

async function load() {
  if (!password) return;
  try {
    render(await decrypt(await fetchEnc(), password));
  } catch (e) {
    if (e.name === "OperationError") { password = null; store.del(); showLock("Password changed - enter it again"); }
    else $("err").textContent = "Could not load status: " + e.message;
  }
}
// ---- run details + encrypted screenshots ----
function detailRows(r) {
  const d = r.details || {};
  const row = (k, v, auto) => v === undefined || v === null || v === "" ? "" :
    `<dt>${k}</dt><dd${auto ? ' dir="auto"' : ""}>${esc(v)}</dd>`;
  return [
    row("Court", r.court, true),
    row("Date", d.date),
    row("Time", d.time_range),
    row("Booking ID", d.booking_id),
    row("Allowance used", d.allowance_used),
    row("Date opened", d.date_opened_at ? d.date_opened_at + (d.refreshes ? ` (after ${d.refreshes} refreshes)` : "") : ""),
    row("Booked in", d.seconds_after_open !== undefined ? d.seconds_after_open + " s after it opened" : ""),
    row("Attempts", r.attempts > 1 ? r.attempts : ""),
    row("Reason", d.reason, true),
    row("Ran", fmt(r.ts)),
    !d.reason && r.message ? row("Result", r.message, true) : "",
  ].join("");
}
const shotCache = new Map();
async function shotURL(path) {
  if (!shotCache.has(path)) {
    shotCache.set(path, (async () => {
      const res = await fetch(path, { cache: "force-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const img = await decrypt(await res.json(), password);
      return `data:${img.mime};base64,${img.b64}`;
    })());
  }
  return shotCache.get(path);
}
function loadShots(root) {
  root.querySelectorAll("[data-shot]").forEach(async el => {
    try {
      const url = await shotURL(el.dataset.shot);
      el.innerHTML = `<a href="${url}" target="_blank" rel="noopener"><img alt="Screenshot of the app at the end of the run" src="${url}"></a>`;
    } catch (e) {
      shotCache.delete(el.dataset.shot);
      el.innerHTML = `<span class="muted">Screenshot unavailable (${esc(e.message)})</span>`;
    }
  });
}

function render(s) {
  try {
    $("updated").textContent = "Updated " + fmt(s.updated);
    const runs = s.runs || [];
    const r = runs[0];
    if (r) {
      const [cls, label] = kind(r);
      $("latest").innerHTML = `
        <div class="status"><span class="badge ${cls}">${label}</span>
          <span class="big" dir="auto">${esc(r.target)}</span></div>
        <dl class="grid" style="margin-top:12px">${detailRows(r)}</dl>
        ${r.shot ? `<div class="shot" data-shot="${esc(r.shot)}"><span class="muted">Loading screenshot…</span></div>` : ""}`;
    } else {
      $("latest").innerHTML = `<div class="status"><span class="badge wait">Waiting</span><span>No runs yet</span></div>`;
    }
    const sc = s.schedule || {};
    $("schedule").innerHTML = `
      <dt>Books</dt><dd dir="auto">${esc(sc.weekday)} ${esc(sc.time)} · ${esc(sc.duration)}</dd>
      <dt>Courts</dt><dd dir="auto">${esc((sc.courts || []).join(" → "))}</dd>
      <dt>Opens</dt><dd>${esc(sc.opens)}</dd>
      <dt>Next run</dt><dd>${fmt(sc.next_open)}</dd>
      <dt>Mode</dt><dd>${sc.dry_run ? '<span class="badge dry">Dry run</span>' : '<span class="badge ok">Live</span>'}</dd>`;
    $("runs").innerHTML = runs.map((r, i) => {
      const [cls, label] = kind(r);
      return `<li><span dir="auto">${esc(r.target)}${r.court ? " · " + esc(r.court) : ""}</span>
        <span class="badge ${cls}">${label}</span>
        <span class="msg">${fmt(r.ts)}${r.message ? " — " + esc(r.message) : ""}
          ${i > 0 && (r.shot || r.details) ? ` · <button class="link" data-more="${i}">Details</button>` : ""}</span>
        <div class="more" id="more-${i}" hidden></div></li>`;
    }).join("") || '<li class="muted">No runs yet</li>';
    document.querySelectorAll("[data-more]").forEach(btn => btn.addEventListener("click", () => {
      const i = +btn.dataset.more, r = runs[i], box = $("more-" + i);
      if (!box.hidden) { box.hidden = true; btn.textContent = "Details"; return; }
      box.innerHTML = `<dl class="grid">${detailRows(r)}</dl>` +
        (r.shot ? `<div class="shot" data-shot="${esc(r.shot)}"><span class="muted">Loading screenshot…</span></div>` : "");
      box.hidden = false; btn.textContent = "Hide";
      loadShots(box);
    }));
    loadShots($("latest"));
    $("err").textContent = "";
  } catch (e) {
    $("err").textContent = "Could not show status: " + e.message;
  }
}
(async () => {
  const saved = store.get();
  if (!saved) return showLock();
  try {
    const s = await decrypt(await fetchEnc(), saved);
    password = saved; $("app").hidden = false; render(s);
  } catch { store.del(); showLock(); }
})();
setInterval(load, 60000);
</script>
</body>
</html>
